name: Update TEFAS Data

on:
  schedule:
    # 09:00 TRT (06:00 UTC) and 12:00 TRT (09:00 UTC)
    - cron: '0 6,9 * * *'
  workflow_dispatch: # Allows manual run

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        
    - name: Install Dependencies
      run: |
        pip install -r requirements.txt
        
    - name: Run Fetch Script
      env:
        FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      run: |
        python fetch_tefas_data.py

    - name: Verify Snapshot Output
      run: |
        python - <<'PY'
        import json
        from pathlib import Path

        path = Path("src/data/tefas_data.json")
        if not path.exists():
            raise SystemExit("tefas_data.json not found")

        payload = json.loads(path.read_text(encoding="utf-8"))
        data = payload.get("data", {})
        dates = sorted({item.get("date") for item in data.values() if item.get("date")})
        latest_price_date = dates[-1] if dates else "unknown"

        print("WORKFLOW VERIFY :: "
              f"lastUpdated={payload.get('lastUpdated')} :: "
              f"count={payload.get('count')} :: "
              f"latestPriceDate={latest_price_date}")
        PY

    - name: Commit and Push Updated Data
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add src/data/tefas_data.json
        git diff --staged --quiet || git commit -m "📊 Update TEFAS data [$(date +'%Y-%m-%d %H:%M')]"
        git push
